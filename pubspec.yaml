name: database_benchmarks
description: Benchmark Flutter app comparing multiple local database packages.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.3
  path: ^1.9.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  collection: ^1.18.0
  csv: ^6.0.0
  share_plus: ^10.1.4
  sqflite: ^2.3.3+1
  sqflite_sqlcipher: ^3.2.0
  drift: ^2.28.2
  drift_flutter: ^0.2.5
  hive: ^2.2.3
  sembast: ^3.8.5+1
  objectbox: ^4.3.0
  objectbox_flutter_libs: ^4.3.0
  isar_community: ^3.1.0+1
  isar_community_flutter_libs: ^3.1.0+1
  fl_chart: ^0.69.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.28.2
  hive_generator: ^2.0.1
  objectbox_generator: ^4.3.0
  isar_community_generator: ^3.1.0+1
  freezed: ^2.5.2
  freezed_annotation: ^2.4.1
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
